# Silverland frontend — Netlify (Next.js runtime)
# Add NEXT_PUBLIC_API_URL in the Netlify dashboard build env (points at the Render backend).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: SPA fallback if a route 404s
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
