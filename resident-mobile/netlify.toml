# Silverland Resident Mobile — Netlify (Next.js runtime)
# Add NEXT_PUBLIC_API_URL in the Netlify dashboard build env (points at the Render backend).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
